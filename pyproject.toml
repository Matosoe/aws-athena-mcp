[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-athena-knowledge-mcp"
version = "0.1.0"
description = "Servidor MCP local para Athena e catálogo de tabelas no S3."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "boto3>=1.37.0",
  "mcp[cli]>=1.26.0",
  "pydantic>=2.10.0,<3.0.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "black>=25.1.0",
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
]

[project.scripts]
athena-knowledge-mcp = "athena_knowledge_mcp.server.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["athena_knowledge_mcp"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
disallow_untyped_defs = true
no_implicit_optional = true
